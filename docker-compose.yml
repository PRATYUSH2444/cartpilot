version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cartpilot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cartpilot_dev
    volumes:
      - cartpilot_mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cartpilot_mongodb_data:
    driver: local
